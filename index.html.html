<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>積立投資シミュレーター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* 画面全体のベース設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6; /* 薄いグレーの背景 */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center; /* 画面の中央に配置 */
        }
        /* アプリのメイン画面（白い箱） */
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px; /* 角を丸くする */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* 影をつけて浮かせせる */
            width: 100%;
            max-width: 500px; /* PCでは最大500px、スマホでは画面幅に自動縮小 */
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
        /* 入力項目のレイアウト */
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column; /* 縦並びにする */
        }
        .input-group label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #666;
        }
        .input-group input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        /* ボタンのデザイン */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3; /* カーソルを当てると色が濃くなる */
        }
        /* 結果表示エリア */
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 6px;
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
        }
        .chart-container {
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>積立投資シミュレーター</h2>
        
        <div class="input-group">
            <label>初期投資額（円）</label>
            <input type="number" id="initial" value="0">
        </div>
        <div class="input-group">
            <label>毎月の積立額（円）</label>
            <input type="number" id="monthly" value="30000">
        </div>
        <div class="input-group">
            <label>想定年利（％）</label>
            <input type="number" id="rate" value="5" step="0.1">
        </div>
        <div class="input-group">
            <label>積立期間（年）</label>
            <input type="number" id="years" value="20">
        </div>
        
        <button onclick="calculateInvestment()">計算する</button>

        <div id="result">ここに結果が出ます</div>
        
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        // JSの計算ロジック（変更なし）
        let myChart = null;

        function calculateInvestment() {
            let initial = Number(document.getElementById('initial').value);
            let monthly = Number(document.getElementById('monthly').value);
            let rate = Number(document.getElementById('rate').value) / 100;
            let years = Number(document.getElementById('years').value);
            
            let totalMonths = years * 12;
            let monthlyRate = rate / 12;
            
            let finalAmount = initial;
            let totalPrincipal = initial;
            
            let labels = [0];
            let principalData = [initial];
            let amountData = [initial];

            for (let i = 1; i <= totalMonths; i++) {
                finalAmount += monthly;
                finalAmount *= (1 + monthlyRate);
                totalPrincipal += monthly;

                if (i % 12 === 0) {
                    labels.push(i / 12);
                    principalData.push(Math.floor(totalPrincipal));
                    amountData.push(Math.floor(finalAmount));
                }
            }

            let profit = finalAmount - totalPrincipal;
            
            document.getElementById('result').innerHTML = 
                "最終積立金額: <strong>" + Math.floor(finalAmount).toLocaleString() + " 円</strong><br>" +
                "（うち元本: " + totalPrincipal.toLocaleString() + " 円 / " +
                "運用収益: " + Math.floor(profit).toLocaleString() + " 円）";

            drawChart(labels, principalData, amountData);
        }

        function drawChart(labels, principalData, amountData) {
            let ctx = document.getElementById('myChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '元本', data: principalData, backgroundColor: '#36a2eb' },
                        { label: '運用収益', data: amountData.map((a, i) => a - principalData[i]), backgroundColor: '#ff6384' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: true, title: { display: true, text: '経過年数' } },
                        y: { stacked: true, title: { display: true, text: '金額（円）' } }
                    }
                }
            });
        }

        // 開いた瞬間に1回自動で計算を実行し、空の画面になるのを防ぐ
        window.onload = calculateInvestment;
    </script>
</body>
    <script>
        // クリアボタンのイベントとリセット関数を追加
        function clearInputs() {
            document.getElementById('monthly').value = '';
            document.getElementById('years').value = '';
            document.getElementById('rate').value = '';
            document.getElementById('result').innerHTML = '';
            if (window.myChart) {
                window.myChart.destroy();
            }
        }
    </script>
</body>


<script>
    // クリアボタンを描画するための処理
    win</html>dow.addEventListener('DOMContentLoaded', function () {
        // 入力フォームの下にクリアボタンを追加
        const container = document.querySelector('.container');
        if (container) {
            const clearBtn = document.createElement('button');
            clearBtn.type = 'button';
            clearBtn.textContent = 'クリア';
            clearBtn.style.backgroundColor = '#6c757d'; // グレー
            clearBtn.style.marginTop = '8px';
            clearBtn.onclick = clearInputs;

            // すでにシミュレート開始ボタンがある場合はその直後に挿入
            const buttons = container.querySelectorAll('button');
            if (buttons.length) {
                buttons[buttons.length - 1].insertAdjacentElement('afterend', clearBtn);
            } else {
                container.appendChild(clearBtn);
            }
        }
    });
</script>
